version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: patulod-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: patulod_admin
      POSTGRES_PASSWORD: patulod_dev_password
      POSTGRES_DB: patulod_admin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patulod_admin -d patulod_admin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
